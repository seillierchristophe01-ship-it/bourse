name: Mise à jour des données
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        market: [paris, newyork, tokyo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy requests lxml openpyxl
      - run: python fetch_data.py ${{ matrix.market }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data_${{ matrix.market }}.json
          git commit -m "maj ${{ matrix.market }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 5; done
