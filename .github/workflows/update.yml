name: Mise à jour des données
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy requests lxml
      - run: python fetch_data.py
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data.json; git commit -m "maj données" || echo "rien"; git push
