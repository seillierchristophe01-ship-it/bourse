<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Scanner Bourse</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--bd:#333}}
body{font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,button{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
button{cursor:pointer;font-weight:600}.mut{color:var(--mut);font-size:12px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{cursor:pointer;position:sticky;top:0;background:var(--bg)}th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
.n{font-weight:600}.Hausse{color:#1a8f3c}.Baisse{color:#d33}.Neutre{color:var(--mut)}
</style></head><body>
<h2 style="margin:0 0 8px">Scanner Paris · New York · Tokyo</h2>
<div class="bar"><button id="r">Rafraîchir</button><input id="q" placeholder="Rechercher…">
<select id="m"><option value="">Tous les marchés</option><option>Paris</option><option>New York</option><option>Tokyo</option></select>
<select id="t"><option value="">Toutes tendances</option><option>Hausse</option><option>Neutre</option><option>Baisse</option></select>
<span class="mut" id="g"></span></div>
<div class="mut" id="e"></div><div class="w"><table><thead id="h"></thead><tbody id="b"></tbody></table></div>
<p class="mut">Notes de 0 à 10. Outil d'aide à l'analyse, pas un conseil en investissement : une note ne prédit pas l'avenir. Le potentiel vient des objectifs des analystes (Yahoo), fourchette basse–haute.</p>
<script>
let D=null,key="global",dir=-1;
const C=[["mkt","Marché"],["t","Ticker"],["name","Nom"],["price","Cours"],["trend","Tendance"],["global","Globale"],["tendance","Tendance MM"],["rsi","RSI"],["macd","MACD"],["bollinger","Bollinger"],["volume","Volume"],["valorisation","Valo"],["croissance","Croiss."],["potentiel","Potentiel"],["pot","Pot. % (bas / moy / haut)"]];
const col=v=>`hsl(${v*12},60%,${matchMedia("(prefers-color-scheme:dark)").matches?"30%":"85%"})`;
const val=(r,k)=>k in r?r[k]:k=="pot"?(r.pot?r.pot.mid:-9):r.scores[k];
const pc=x=>x==null?"–":(x*100).toFixed(0)+"%";
function draw(){if(!D)return;
 const q=document.getElementById("q").value.toLowerCase(),m=document.getElementById("m").value,t=document.getElementById("t").value;
 let rows=D.rows.filter(r=>(!m||r.mkt==m)&&(!t||r.trend==t)&&(r.t+r.name).toLowerCase().includes(q));
 rows.sort((a,b)=>{const x=val(a,key),y=val(b,key);return(x>y?1:x<y?-1:0)*dir});
 document.getElementById("h").innerHTML="<tr>"+C.map(c=>`<th data-k="${c[0]}">${c[1]}${c[0]==key?(dir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
 document.getElementById("b").innerHTML=rows.map(r=>`<tr><td>${r.mkt}</td><td>${r.t}</td><td>${r.name}</td><td>${r.price}</td><td class="${r.trend}">${r.trend}</td><td class="n" style="background:${col(r.global)}">${r.global}</td>`+
 ["tendance","rsi","macd","bollinger","volume","valorisation","croissance","potentiel"].map(k=>`<td style="background:${col(r.scores[k])}">${r.scores[k]}</td>`).join("")+
 `<td>${r.pot?pc(r.pot.lo)+" / "+pc(r.pot.mid)+" / "+pc(r.pot.hi):"–"}</td></tr>`).join("");
 document.querySelectorAll("th").forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k==key?-dir:-1;key=k;draw()});}
async function load(){const b=document.getElementById("r");b.disabled=true;b.textContent="Chargement…";
 try{D=await(await fetch("data.json?"+Date.now(),{cache:"no-store"})).json();
  document.getElementById("g").textContent="Données du "+new Date(D.generated).toLocaleString("fr-FR")+" · "+D.rows.length+" titres";
  document.getElementById("e").textContent=D.errors.length?"Avertissements : "+D.errors.slice(0,3).join(" | "):"";draw();}
 catch(e){document.getElementById("g").textContent="Impossible de charger data.json"}
 b.disabled=false;b.textContent="Rafraîchir"}
document.getElementById("r").onclick=load;["q","m","t"].forEach(i=>document.getElementById(i).oninput=draw);load();
</script></body></html>
